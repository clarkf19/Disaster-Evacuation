name: Keep backend awake

# Render's free tier puts the backend to sleep after 15 minutes without traffic,
# and waking it takes 30-60 s. Pinging the health endpoint every 10 minutes keeps
# it warm. GitHub may delay scheduled runs by a few minutes; that's fine.
# Free for public repositories. Scheduled workflows pause after 60 days without
# repository activity — re-enable from the Actions tab if that happens.
# Set the repository variable BACKEND_URL to override the default URL.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /actuator/health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://mumbai-evac-backend.onrender.com' }}
        # A wrong answer (e.g. 404 from an old deployment without /actuator/health) fails the run,
        # so a stale or broken backend shows up as a red X in the Actions tab.
        run: |
          code=$(curl -sS -m 150 -o /dev/null -w "%{http_code}" "$BACKEND_URL/actuator/health" || echo "000")
          echo "Backend answered HTTP $code"
          if [ "$code" = "000" ]; then echo "No answer (it may still be waking up)"; exit 0; fi
          if [ "$code" != "200" ]; then echo "::error::Backend health check returned HTTP $code — is the latest version deployed?"; exit 1; fi
