spring:
  application:
    name: mumbai-evacuation-system
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

server:
  port: ${PORT:8080}

logging:
  level:
    com.mumbai: INFO

# TomTom Routing API — key stored securely on backend only, never exposed to frontend
tomtom:
  api:
    key: ${TOMTOM_API_KEY:}
    routing-base-url: https://api.tomtom.com/routing/1/calculateRoute
    geocode-base-url: https://api.tomtom.com/search/2/reverseGeocode

# Emergency AI Assistant LLM configuration
llm:
  provider: ${LLM_PROVIDER:gemini}
  api-key: ${GEMINI_API_KEY:}
  gemini-model: gemini-1.5-flash

